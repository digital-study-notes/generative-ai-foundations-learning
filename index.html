<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>生成AIファンデーションズ 学習プロトタイプ</title>
<style>
:root{--navy:#14284b;--blue:#3978f6;--cyan:#37c8d7;--bg:#f3f7fc;--text:#1d2940;--muted:#64748b;--ok:#14865d;--bad:#c33d55;--card:#fff;--line:#d9e4f2}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:linear-gradient(135deg,#eef5ff,#f8fbff);color:var(--text)}button{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top{height:68px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 28px;gap:18px}.brand{font-weight:800}.tag{font-size:12px;border:1px solid #ffffff55;border-radius:20px;padding:4px 9px}.progress{margin-left:auto;width:min(360px,35vw)}.rail{height:7px;background:#ffffff2b;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--cyan),#87f1cb);width:0;transition:.45s}.meta{font-size:12px;text-align:right;margin-top:5px}.stage{display:grid;grid-template-columns:280px 1fr;min-height:0}.side{background:#fff;border-right:1px solid var(--line);padding:22px 16px;overflow:auto}.side h2{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 10px 12px}.chapter{display:block;width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:12px;color:#44516b;cursor:pointer}.chapter.active{background:#eaf2ff;color:#1d5fd0;font-weight:700}.chapter small{display:block;color:#8090a8;margin-top:4px}.main{padding:26px;display:flex;justify-content:center;align-items:center}.card{width:min(100%,1040px);min-height:600px;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 50px #17366a18;padding:46px 54px;position:relative;overflow:hidden}.eyebrow{color:var(--blue);font-size:13px;font-weight:800;letter-spacing:.08em}.card h1{font-size:clamp(30px,4vw,52px);line-height:1.15;margin:14px 0 18px}.lead{font-size:20px;line-height:1.8;color:#41516d;max-width:820px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:26px}.box{border:1px solid var(--line);border-radius:17px;padding:21px;background:#fbfdff}.box h3{margin:0 0 10px}.pill{display:inline-block;border-radius:99px;background:#e8f3ff;color:#2761bd;padding:5px 10px;font-size:12px;font-weight:700}.compare{display:grid;grid-template-columns:1fr 54px 1fr;align-items:stretch;gap:16px;margin-top:28px}.vs{display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:900}.flow{display:flex;align-items:center;justify-content:center;gap:15px;margin:34px 0;flex-wrap:wrap}.node{padding:19px 25px;border-radius:16px;background:#edf4ff;border:1px solid #cfe0ff;font-weight:750}.arrow{font-size:28px;color:var(--blue);animation:pulse 1.2s infinite}.choice{display:block;width:100%;text-align:left;padding:14px 16px;margin:10px 0;border:1px solid var(--line);background:#fff;border-radius:12px;cursor:pointer}.choice:hover{border-color:#79a6ff;background:#f6f9ff}.choice.correct{border-color:#43b98a;background:#eaf9f2}.choice.wrong{border-color:#e07888;background:#fff0f2}.feedback{margin-top:16px;padding:16px;border-radius:12px;background:#eef4ff;display:none;line-height:1.65}.prompt{background:#101b31;color:#e7efff;border-radius:16px;padding:20px;line-height:1.7;margin-top:18px}.token{display:inline-block;padding:3px 7px;border-radius:7px;margin:2px;background:#274568;opacity:0;animation:show .35s forwards}.callout{border-left:5px solid var(--cyan);background:#effcfd;padding:17px 20px;border-radius:0 14px 14px 0;margin-top:24px}.foot{height:76px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:12px;padding:12px}.nav{border:0;border-radius:12px;padding:13px 22px;font-weight:800;cursor:pointer}.prev{background:#edf2f8;color:#4c5a72}.next{background:var(--blue);color:#fff}.home{background:#fff;border:1px solid var(--line)}.copyright{font-size:12px;color:var(--muted);position:absolute;bottom:16px;right:22px}.result{text-align:center;padding-top:60px}.score{font-size:76px;font-weight:900;color:var(--blue)}@keyframes pulse{50%{transform:translateX(6px)}}@keyframes show{to{opacity:1;transform:translateY(0)}}@media(max-width:820px){.stage{grid-template-columns:1fr}.side{display:none}.main{padding:12px}.card{padding:30px 22px;min-height:600px}.grid,.compare{grid-template-columns:1fr}.vs{height:20px}.top{padding:0 14px}.tag{display:none}.progress{width:42vw}}
</style>
</head>
<body><div class="app"><header class="top"><div class="brand">生成AIファンデーションズ</div><span class="tag">大学生向け学習プロトタイプ</span><div class="progress"><div class="rail"><div class="fill" id="fill"></div></div><div class="meta" id="meta"></div></div></header><div class="stage"><aside class="side"><h2>カリキュラム</h2><div id="chapters"></div></aside><main class="main"><section class="card" id="card"></section></main></div><footer class="foot"><button class="nav home" onclick="go(0)">目次</button><button class="nav prev" onclick="move(-1)">← 前へ</button><button class="nav next" onclick="move(1)">次へ →</button></footer></div>
<script>
const slides=[
{c:'スタート',t:'いつもの生成AI利用を、将来の仕事に生かせる力へ',b:`<p class="lead">生成AIを「使ったことがある」から、「目的に合わせ、安全に使い分けられる」へ。試験範囲を、大学生活の身近な場面から学びます。</p><div class="grid"><div class="box"><span class="pill">学習内容</span><h3>仕組み・プロンプト・検証</h3><p>自然な回答が作られる理由と、より良い指示の作り方を理解します。</p></div><div class="box"><span class="pill">安全な利用</span><h3>権利・情報・責任</h3><p>著作権、個人情報、バイアスなどをケースで判断します。</p></div></div><div class="callout">この版は全体設計を確認できる実動プロトタイプです。教材本文と問題は独自に制作しています。</div>`},
{c:'1. 検索と生成AI',t:'検索と生成AIは、同じではない',b:`<div class="compare"><div class="box"><span class="pill">検索</span><h3>存在する情報を探す</h3><p>情報源へのリンクを手がかりに、発信者・日付・根拠を確認できます。</p></div><div class="vs">VS</div><div class="box"><span class="pill">生成AI</span><h3>回答を組み立てる</h3><p>学習したパターンを基に、入力に続くもっともらしい出力を生成します。</p></div></div><div class="callout"><b>使い分け：</b>アイデア整理や下書きは生成AI。試験日、統計、制度、引用元など正確性と最新性が重要な情報は一次情報で確認します。</div>`},
{c:'1. 検索と生成AI',t:'確認：どちらを中心に使う？',b:`<p class="lead">「来年度の資格試験の申込期限」を調べます。最も適切な行動はどれですか。</p>${quiz('q1',['生成AIの回答だけで確定する','主催者の公式サイトで最新情報を確認する','SNSの投稿数が多い日付を採用する'],1,'申込期限は変わる可能性があります。生成AIを入口にしても、最終判断は主催者の公式情報で確認します。')}`},
{c:'2. 生成の仕組み',t:'回答は「次に続く表現」の積み重ね',b:`<p class="lead">大規模言語モデルは、入力を小さな単位に分け、文脈に応じて次に続く可能性の高い表現を選びながら回答を作ります。</p><div class="flow"><div class="node">入力</div><div class="arrow">→</div><div class="node">トークン化</div><div class="arrow">→</div><div class="node">確率的に生成</div><div class="arrow">→</div><div class="node">出力</div></div><div class="prompt"><span class="token" style="animation-delay:.1s">生成AIは</span><span class="token" style="animation-delay:.4s">文章の続きを</span><span class="token" style="animation-delay:.7s">文脈に合わせて</span><span class="token" style="animation-delay:1s">生成する</span></div><div class="callout">自然な文章であることと、事実として正しいことは別です。これがハルシネーションを検証する必要がある理由です。</div>`},
{c:'2. 生成の仕組み',t:'モデルは目的によって異なる',b:`<div class="grid"><div class="box"><h3>トランスフォーマー</h3><p>文章などの文脈上の関係を扱い、テキスト生成で広く利用されます。</p></div><div class="box"><h3>拡散モデル</h3><p>ノイズから段階的に画像などを作る考え方です。</p></div><div class="box"><h3>GAN</h3><p>生成側と識別側を競わせ、より本物らしい出力を目指します。</p></div><div class="box"><h3>VAE</h3><p>データの特徴を圧縮した表現から、新しいデータを生成します。</p></div></div><div class="callout">試験対策では「名称だけ」ではなく、どのような生成に関係するかを大づかみに区別します。</div>`},
{c:'3. プロンプト',t:'良い指示は、4つの部品で作る',b:`<div class="grid"><div class="box"><h3>①目的</h3><p>何のために作るか</p></div><div class="box"><h3>②背景・対象</h3><p>誰に、どんな状況で使うか</p></div><div class="box"><h3>③条件</h3><p>長さ、範囲、禁止事項</p></div><div class="box"><h3>④出力形式</h3><p>表、箇条書き、文章など</p></div></div><div class="prompt">大学1年生向けに、生成AIの回答を検証する方法を、具体例を1つ含む箇条書き5項目で説明してください。専門用語には短い補足を付けてください。</div>`},
{c:'3. プロンプト',t:'改善：曖昧な指示に情報を足す',b:`<p class="lead">「生成AIについて説明して」では、目的も対象も形式も不明です。追加すべき情報として最も有効な組合せを選びましょう。</p>${quiz('q2',['回答をとにかく長くする','対象者・目的・文字数・形式を指定する','同じ指示を何度も入力する'],1,'対象者、目的、制約、形式を明確にすると、期待する出力に近づきます。初回出力を見て対話的に改善することも重要です。')}`},
{c:'4. 検証と改善',t:'出力を「受け取る」で終わらせない',b:`<div class="flow"><div class="node">生成</div><div class="arrow">→</div><div class="node">根拠確認</div><div class="arrow">→</div><div class="node">比較</div><div class="arrow">→</div><div class="node">修正・判断</div></div><div class="grid"><div class="box"><h3>歴史的事実</h3><p>公的資料、原典、複数の信頼できる資料で照合。</p></div><div class="box"><h3>現在の事実</h3><p>公式サイトの更新日や最新発表を確認。</p></div><div class="box"><h3>数値データ</h3><p>定義、母集団、調査年、単位を確認。</p></div><div class="box"><h3>引用</h3><p>実在、原文、ページ、利用条件を確認。</p></div></div>`},
{c:'5. 倫理・法律・社会',t:'入力してよい情報か、送信前に止まる',b:`<p class="lead">大学での利用と、就職後の業務利用では、扱う情報の重さが変わります。</p><div class="grid"><div class="box"><span class="pill">入力を避ける</span><h3>個人情報・機密情報</h3><p>氏名、連絡先、未公表情報、顧客情報、契約情報、認証情報など。</p></div><div class="box"><span class="pill">確認する</span><h3>サービスの設定と規約</h3><p>入力データの保存、学習利用、管理者設定、利用目的を確認します。</p></div></div><div class="callout">「無料で使える」ことは「何を入力してもよい」ことを意味しません。組織のルールとサービスの条件を優先します。</div>`},
{c:'5. 倫理・法律・社会',t:'著作権と生成AI',b:`<div class="grid"><div class="box"><h3>他人の作品</h3><p>許諾なく作品自体を転載・配布しない。作風模倣の依頼も慎重に扱います。</p></div><div class="box"><h3>生成物</h3><p>既存作品との類似、素材の利用条件、商用利用条件を確認します。</p></div><div class="box"><h3>透明性</h3><p>授業や職場のルールに応じて、AIを利用した過程を記録・表示します。</p></div><div class="box"><h3>最終責任</h3><p>公開・提出前に人が確認し、採用する内容に責任を持ちます。</p></div></div><div class="callout">この教材は公開された出題範囲を基に独自制作し、市販模擬問題の問題文・選択肢・解説・画面を複製していません。</div>`},
{c:'6. 総合確認',t:'ケース問題：レポート作成',b:`<p class="lead">生成AIが、実在しない参考文献を含むレポート案を出力しました。最も適切な対応はどれですか。</p>${quiz('q3',['文章が自然なのでそのまま提出する','参考文献の実在と内容を確認し、確認できないものは使わない','生成AI名だけを参考文献欄に書く'],1,'引用や文献は、実在と内容を原典で確認します。生成AIの出力は下書きとして扱い、提出者自身が検証・修正します。')}`},
{c:'7. 修了',t:'プロトタイプ修了',b:`<div class="result"><div class="score" id="score">0/3</div><h2>学んだこと</h2><p class="lead" style="margin:auto">生成方法の理解、適切なプロンプト、出力の検証、情報と権利への配慮を一つの流れとして扱うことが、試験対策と実践の両方につながります。</p><div class="callout" style="text-align:left">次の制作段階では、画像・動画・音声の生成と変換、ツール選定、few-shotなどのプロンプト手法、バイアスと社会的影響、複数選択・並べ替え・ドラッグ操作を追加します。</div></div>`}
];
const answers={};let i=0;
function quiz(id,opts,correct,fb){return `<div>${opts.map((x,n)=>`<button class="choice" onclick="answer('${id}',${n},${correct},this)">${String.fromCharCode(65+n)}. ${x}</button>`).join('')}<div class="feedback" id="${id}f">${fb}</div></div>`}
function answer(id,n,correct,el){answers[id]=n===correct;el.parentElement.querySelectorAll('.choice').forEach((b,k)=>{b.disabled=true;if(k===correct)b.classList.add('correct');else if(k===n)b.classList.add('wrong')});document.getElementById(id+'f').style.display='block';localStorageSafe()}
function localStorageSafe(){try{localStorage.setItem('gaf-progress',JSON.stringify({i,answers}))}catch(e){}}
function render(){const s=slides[i];document.getElementById('card').innerHTML=`<div class="eyebrow">${s.c}</div><h1>${s.t}</h1>${s.b}<div class="copyright">© 2026 Original learning prototype</div>`;document.getElementById('fill').style.width=((i+1)/slides.length*100)+'%';document.getElementById('meta').textContent=`${i+1} / ${slides.length}`;document.querySelectorAll('.chapter').forEach((x,n)=>x.classList.toggle('active',n===i));if(document.getElementById('score'))document.getElementById('score').textContent=Object.values(answers).filter(Boolean).length+'/3';localStorageSafe()}
function move(d){i=Math.max(0,Math.min(slides.length-1,i+d));render()}function go(n){i=n;render()}
const ch=document.getElementById('chapters');slides.forEach((s,n)=>{const b=document.createElement('button');b.className='chapter';b.innerHTML=`${s.c}<small>${s.t}</small>`;b.onclick=()=>go(n);ch.appendChild(b)});render();
</script></body></html>
